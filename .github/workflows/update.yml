name: Update Skillrush Town

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch ClawHub snapshot
        run: python scripts/clawhub_daily.py
      - name: Generate Atom feed
        run: python scripts/generate_feed.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data feed.xml
          git diff --cached --quiet || git commit -m "chore: update clawhub snapshot"
          git push
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - uses: actions/deploy-pages@v4
      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%F)
          BODY="$DATE 的每日更新跑挂了。Run: $RUN_URL"
          gh label create scrape-failure --repo "$REPO" --color B60205 --description "每日抓取失败告警" --force
          EXISTING=$(gh issue list --repo "$REPO" --label scrape-failure --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body "$BODY"
          else
            gh issue create --repo "$REPO" --title "抓取失败告警 $DATE" --body "$BODY" --label scrape-failure
          fi
